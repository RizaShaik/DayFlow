services:
  postgres:
    image: postgres:16-alpine
    container_name: dayflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-dayflow}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-dayflow}
      POSTGRES_DB: ${DB_NAME:-dayflow}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - dayflow_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-dayflow} -d ${DB_NAME:-dayflow}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dayflow_pgdata:
